name: Slickdeals alert

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run a few minutes late)
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to save seen.json back to the repo

concurrency:
  group: slickdeals-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check feed and email new deals
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FEED_URL: ${{ vars.FEED_URL }}
          BATCH: ${{ vars.BATCH }}
          KEYWORDS: ${{ vars.KEYWORDS }}
        run: python slickdeals_alert.py

      - name: Save list of deals already sent
        run: |
          git config user.name "slickdeals-alert"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen deals"
          git push
